import { createRoot } from "react-dom/client";

import React, { useState, useEffect, useRef, useMemo } from "react";
import {
  Heart, X, ArrowRight, ArrowLeft, Sparkles, Scissors, Wand2, Star, Mail,

/* ---------------------------------------------------------
   DESIGN TOKENS — flat brand system, no gradients.
   White base to match the live site, LCBT's own deep plum
   (#19061C, pulled from their theme-color meta tag) as the
   primary dark/text colour, one flat pink accent for actions.
   NOTE ON FONT: Gotham is a licensed Hoefler&Co typeface and
   can't legally be pulled in via a free web-font link. Poppins
   is used here as a geometric-sans stand-in with a similar
   weight and rhythm — swap in the licensed Gotham webfont
   files at build time.
--------------------------------------------------------- */
const T = {
  bg: "#FFFFFF",
  surface: "#F7F2F6",
  surfaceAlt: "#F1E9EF",
  plum: "#19061C",
  pink: "#E01E6F",
  gold: "#C98A1F",
  text: "#19061C",
  textDim: "#6E5C6A",
  border: "#E5DAE3",
  grey: "#9C8A98",
};

const CATEGORY_STYLE = {
  hair: { color: T.pink, icon: Scissors, label: "Hairdressing" },
  beauty: { color: T.gold, icon: Sparkles, label: "Beauty Therapy" },
  makeup: { color: T.plum, icon: Wand2, label: "Make-Up" },
};

/* ---------------------------------------------------------
   COURSE DATA
--------------------------------------------------------- */
const COURSES = {

  "a19-l3-beauty": { title: "19+ Level 3 Diploma in Beauty Therapy", level: "Level 3", cat: "beauty", blurb: "The adult route into advanced beauty therapy, built around your schedule.", duration: "1 year", funding: "Advanced Learner Loan available" },

  "a19-l3-hair": { title: "19+ Level 3 Diploma in Hairdressing", level: "Level 3", cat: "hair", blurb: "Advanced hairdressing designed for adult learners restarting or upskilling.", duration: "1 year", funding: "Advanced Learner Loan available" },
  "l4-aesthetic": { title: "19+ CIBTAC Level 4 Diploma in Aesthetic Practice", level: "Level 4", cat: "beauty", blurb: "Advanced aesthetics: skin, injectables theory and clinical-grade treatments.", duration: "18 weeks", funding: "Advanced Learner Loan available" },

const INTERESTS = [
  { id: "beauty", label: "Beauty Therapy", ...CATEGORY_STYLE.beauty },
  { id: "hair", label: "Hairdressing", ...CATEGORY_STYLE.hair },
  { id: "makeup", label: "Make-Up", ...CATEGORY_STYLE.makeup },
  { id: "all", label: "I love it all", color: T.pink, icon: Heart },
];

const GOALS = [
  { id: "career", label: "Start a career in the industry", icon: Briefcase },
  { id: "self", label: "Become self-employed", icon: Rocket },
  { id: "improve", label: "Improve my existing skills", icon: TrendingUp },
  { id: "change", label: "Change careers", icon: Repeat },
  { id: "unsure", label: "Not sure yet", icon: HelpCircle },
];

/* ---------------------------------------------------------
   MATCHING LOGIC (unchanged from prior pass — see notes below
   the component for the two flagged assumptions)
--------------------------------------------------------- */
function getMatches(a) {
  if (a.age === "16-18") {
    const table = {
      beauty: ["l2-beauty", "l2-mua", "l2-hair"],
      hair: ["l2-hair", "l2-mua", "l2-beauty"],
      makeup: ["l2-mua", "l2-beauty", "l2-hair"],
      all: ["l2-mua", "l2-beauty", "l2-hair"],
    };
    const [best, alt1, alt2] = table[a.interest];
    return { type: "courses", ids: [best, alt1, alt2] };
  }
  if (a.priorQual === "no" || a.level === "notsure") {
    return { type: "registerInterest", ids: ["short-courses"] };
  }
  if (a.level === "Level 2") {
    const table = {
      beauty: ["a19-l3-beauty", "short-courses", "l4-aesthetic"],
      hair: ["a19-l3-hair", "short-courses", "a19-l3-mua"],
      makeup: ["a19-l3-mua", "short-courses", "a19-l3-hair"],
      all: ["a19-l3-beauty", "a19-l3-hair", "short-courses"],
    };
    return { type: "courses", ids: table[a.interest] };
  }
  if (a.level === "Level 3") {
    const table = {
      beauty: ["l4-aesthetic", "short-courses"],
      hair: ["short-courses", "a19-l3-mua"],
      makeup: ["short-courses", "a19-l3-hair"],
      all: ["l4-aesthetic", "short-courses"],
    };
    return { type: "courses", ids: table[a.interest] };
  }
  return { type: "registerInterest", ids: ["short-courses"] };
}

function getSteps(a) {
  const steps = ["age", "goal"];
  if (a.age === "19+") {
    steps.push("priorQual");
    if (a.priorQual === "yes") steps.push("level");
  }
  return steps;
}

/* ---------------------------------------------------------

   "what area interests you" question. Instead of asking
   directly, we infer it from a short run of scenario cards
   swiped like Tinder. This does two things the old single tap
   didn't: it front-loads the swipe mechanic so it's familiar
   muscle memory by the time the results deck arrives, and it
   makes the eventual match feel calculated from many small
   signals rather than handed back from one dropdown-style pick.
--------------------------------------------------------- */

// Sums weights across every card the person swiped right on.
// A clear leader wins the category; a close spread resolves to
// "I love it all" rather than an arbitrary tie-break; liking
// nothing returns null so the caller can fall back to a direct pick.
function computeInterest(likedCards) {
  const scores = { hair: 0, beauty: 0, makeup: 0 };
  likedCards.forEach((c) => {
    Object.entries(c.weights).forEach(([k, w]) => { scores[k] += w; });
  });
  const entries = Object.entries(scores).sort((a, b) => b[1] - a[1]);
  const [topCat, topScore] = entries[0];
  const [, secondScore] = entries[1];
  if (topScore === 0) return null;
  if (topScore - secondScore <= 1) return "all";
  return topCat;
}

  interest: (v) => INTERESTS.find((i) => i.id === v)?.label,

/* ---------------------------------------------------------
   FONT LOADER
--------------------------------------------------------- */
function useFonts() {
  useEffect(() => {
    const link = document.createElement("link");
    link.rel = "stylesheet";
    link.href = "https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Poppins:ital@0&display=swap";
    document.head.appendChild(link);
    return () => document.head.removeChild(link);
  }, []);
}

const DISPLAY_FONT = "'Poppins', sans-serif";
const BODY_FONT = "'Poppins', sans-serif";

/* ---------------------------------------------------------
   PHONE FRAME WRAPPER (presentation chrome only — not part
   of the actual product surface)
--------------------------------------------------------- */
function PhoneFrame({ children }) {
  return (
    <div style={{
      minHeight: "100%", width: "100%", display: "flex", alignItems: "center",
      justifyContent: "center", background: "#EDEDED",
      padding: "24px 12px", fontFamily: BODY_FONT, boxSizing: "border-box",
    }}>
      <div style={{
        width: "100%", maxWidth: 400, height: 760, borderRadius: 36, overflow: "hidden",
        position: "relative", background: T.bg, boxShadow: "0 20px 50px rgba(0,0,0,0.18), 0 0 0 8px #1A1A1A",
        display: "flex", flexDirection: "column",
      }}>
        {children}
      </div>
    </div>
  );
}

function ProgressBar({ total, current }) {
  return (
    <div style={{ display: "flex", gap: 5, padding: "16px 20px 0" }}>
      {Array.from({ length: total }).map((_, i) => (
        <div key={i} style={{
          flex: 1, height: 4, borderRadius: 4, background: i < current ? T.plum : T.border,
          transition: "background 0.3s ease",
        }} />
      ))}
    </div>
  );
}

/* Building "profile strip" — small chips that appear as each
   question is answered. Gives a visible sense of a personal
   profile assembling, rather than progress being purely
   abstract (a fill bar alone doesn't feel like it's "for you"). */
function ProfileStrip({ answers, steps }) {
  const answeredSteps = steps.filter((s) => answers[s]);
  if (answeredSteps.length === 0) return <div style={{ height: 14 }} />;
  return (
    <div style={{ display: "flex", gap: 6, padding: "10px 20px 0", flexWrap: "wrap" }}>
      {answeredSteps.map((s) => (
        <span key={s} style={{
          fontSize: 11, fontWeight: 600, color: T.plum, background: T.surface,
          border: `1px solid ${T.border}`, padding: "4px 10px", borderRadius: 999,
          animation: "chipIn 0.25s ease",
        }}>
          {CHIP_LABEL[s](answers[s])}
        </span>
      ))}
    </div>
  );
}

function TopBar({ onBack }) {
  return (
    <div style={{ display: "flex", alignItems: "center", padding: "14px 16px 0" }}>
      {onBack ? (
        <button onClick={onBack} aria-label="Back" style={{
          background: T.surface, border: `1px solid ${T.border}`, width: 34, height: 34, borderRadius: 999,
          display: "flex", alignItems: "center", justifyContent: "center", color: T.plum, cursor: "pointer",
        }}>
          <ArrowLeft size={16} />
        </button>
      ) : <div style={{ width: 34 }} />}
      <div style={{ flex: 1, textAlign: "center", fontFamily: DISPLAY_FONT, fontWeight: 700, fontSize: 11, letterSpacing: 1.5, color: T.textDim }}>
        LCBT COURSE MATCH
      </div>
      <div style={{ width: 34 }} />
    </div>
  );
}

function VibeSwipeDeck({ onComplete }) {
  const [index, setIndex] = useState(0);
  const [offset, setOffset] = useState({ x: 0, y: 0, animating: false });
  const [liked, setLiked] = useState([]);
  const [bursts, setBursts] = useState([]);
  const [glows, setGlows] = useState([]);
  const dragRef = useRef({ startX: 0, startY: 0, dragging: false, moved: 0 });

  const done = index >= VIBE_CARDS.length;

  const fireHeartBurst = () => {
    const glowId = `${Date.now()}-glow`;
    setGlows((prev) => [...prev, { id: glowId }]);
    setTimeout(() => setGlows((prev) => prev.filter((g) => g.id !== glowId)), 950);

    const newBursts = Array.from({ length: 7 }).map((_, i) => ({
      id: `${Date.now()}-${i}`,
      x: 30 + Math.random() * 40,
      delay: i * 55,
      size: 26 + Math.random() * 20,
      rotate: -20 + Math.random() * 40,
    }));
    setBursts((prev) => [...prev, ...newBursts]);
    setTimeout(() => {
      setBursts((prev) => prev.filter((b) => !newBursts.find((nb) => nb.id === b.id)));
    }, 1200);
  };

  const commitSwipe = (dir) => {
    const flyX = dir === "right" ? 600 : -600;
    setOffset({ x: flyX, y: offset.y - 40, animating: true });
    if (dir === "right") {
      setLiked((prev) => [...prev, VIBE_CARDS[index]]);
      fireHeartBurst();
    }
    setTimeout(() => {
      setOffset({ x: 0, y: 0, animating: false });
      setIndex((i) => i + 1);
    }, 300);
  };

  const dragHandlers = {
    onPointerDown: (e) => { dragRef.current = { startX: e.clientX, startY: e.clientY, dragging: true, moved: 0 }; },
    onPointerMove: (e) => {
      if (!dragRef.current.dragging) return;
      const dx = e.clientX - dragRef.current.startX;
      const dy = e.clientY - dragRef.current.startY;
      dragRef.current.moved = Math.abs(dx) + Math.abs(dy);
      setOffset({ x: dx, y: dy, animating: false });
    },
    onPointerUp: () => {
      if (!dragRef.current.dragging) return;
      dragRef.current.dragging = false;
      const dx = offset.x;
      if (dx > 100) commitSwipe("right");
      else if (dx < -100) commitSwipe("left");
      else setOffset({ x: 0, y: 0, animating: true });
    },
  };

  const rotation = Math.max(-16, Math.min(16, offset.x / 12));

  if (done) return <VibeResult liked={liked} onComplete={onComplete} />;

  return (
    <div style={{ flex: 1, display: "flex", flexDirection: "column", padding: "18px 20px 18px", background: T.bg }}>
      <div style={{ marginBottom: 16 }}>
        <div style={{ fontSize: 11, fontWeight: 700, color: T.pink, letterSpacing: 1 }}>
          {index + 1} OF {VIBE_CARDS.length}
        </div>
        <h2 style={{ fontFamily: DISPLAY_FONT, fontSize: 24, color: T.plum, margin: "8px 0 4px", lineHeight: 1.25, fontWeight: 700 }}>
          What would you be excited to learn?
        </h2>
        <p style={{ color: T.textDim, fontSize: 13.5, margin: 0 }}>Swipe right if you're into it, left if you're not</p>
      </div>
      <div style={{ position: "relative", flex: 1 }}>
        <HeartBurst bursts={bursts} glows={glows} />
        {VIBE_CARDS.map((card, i) => {
          if (i < index || i > index + 1) return null;
          const isTop = i === index;
          return (
            <VibeCard key={card.id} card={card} isTop={isTop}
              offset={isTop ? offset : { x: 0, y: 8, animating: false }}
              rotation={isTop ? rotation : 0} dragHandlers={dragHandlers}
              index={i} total={VIBE_CARDS.length} />
          );
        })}
      </div>
      <div style={{ display: "flex", justifyContent: "center", gap: 20, marginTop: 16 }}>
        <button onClick={() => commitSwipe("left")} aria-label="Pass" style={{
          width: 54, height: 54, borderRadius: "50%", border: `1.5px solid ${T.border}`, background: T.bg,
          display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer", color: T.grey,
        }}><X size={24} /></button>
        <button onClick={() => commitSwipe("right")} aria-label="Yes" style={{
          width: 54, height: 54, borderRadius: "50%", border: "none", background: T.pink,
          display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer", color: "#fff",
        }}><Heart size={24} fill="#fff" /></button>
      </div>
    </div>
  );
}

const REASSURANCE = {
  age: "Nice one.",
  goal: "Got it, almost there.",
  priorQual: "One more thing.",
  level: "Last question.",
};

function Quiz({ answers, setAnswers, stepKey, onNext, stepIndex, totalSteps }) {
  const [justPicked, setJustPicked] = useState(null);

  const questions = {
    age: { q: "How old are you?", sub: "Just so we show you the right funding info." },
    goal: { q: "What would you like to do after your qualification?", sub: "Helps us understand what matters to you." },
    priorQual: { q: "Have you completed a beauty, hair or make-up qualification before?", sub: null },
    level: { q: "What level qualification do you currently hold?", sub: "If you're not sure, that's okay too." },
  };

  // Selection now has a visible confirm state (border fills,
  // checkmark appears, brief pause) before advancing, so the
  // tap reads as registered rather than an instant jump-cut.
  const handle = (val) => {
    setAnswers((prev) => ({ ...prev, [stepKey]: val }));
    setJustPicked(val);
    if (navigator.vibrate) navigator.vibrate(8);
    setTimeout(() => {
      setJustPicked(null);
      onNext();
    }, 380);
  };

  const ageOptions = [
    { id: "16-18", label: "16-18", icon: GraduationCap, color: T.pink },
    { id: "19+", label: "19+", icon: UserRound, color: T.pink },
  ];
  const priorQualOptions = [
    { id: "yes", label: "Yes", icon: Check, color: T.gold },
    { id: "no", label: "No", icon: X, color: T.gold },
  ];
  const levelOptions = [
    { id: "Level 2", label: "Level 2", icon: Award, color: T.plum },
    { id: "Level 3", label: "Level 3", icon: Award, color: T.plum },
    { id: "notsure", label: "Not sure", icon: HelpCircle, color: T.plum },
  ];

  return (
    <div style={{ flex: 1, display: "flex", flexDirection: "column", padding: "22px 20px", overflowY: "auto" }}>
      <div style={{ display: "flex", alignItems: "center", gap: 8, fontSize: 11, fontWeight: 700, color: T.pink, letterSpacing: 1 }}>
        QUESTION {stepIndex + 1} OF {totalSteps}
        {REASSURANCE[stepKey] && <span style={{ color: T.textDim, fontWeight: 500, textTransform: "none", letterSpacing: 0 }}>· {REASSURANCE[stepKey]}</span>}
      </div>
      <h2 style={{ fontFamily: DISPLAY_FONT, fontSize: 21, color: T.plum, margin: "10px 0 4px", lineHeight: 1.3, fontWeight: 700 }}>
        {questions[stepKey].q}
      </h2>
      {questions[stepKey].sub && <p style={{ color: T.textDim, fontSize: 13, marginBottom: 6 }}>{questions[stepKey].sub}</p>}

      <div style={{ marginTop: 14 }}>
        {stepKey === "age" && (
          <QuizGrid options={ageOptions} value={answers.age} onSelect={handle} justPicked={justPicked} />
        )}
        {stepKey === "priorQual" && (
          <QuizGrid options={priorQualOptions} value={answers.priorQual} onSelect={handle} justPicked={justPicked} />
        )}
        {stepKey === "level" && (
          <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
            {levelOptions.map((o) => (
              <Tile key={o.id} active={answers.level === o.id} justPicked={justPicked === o.id}
                color={o.color} icon={o.icon} label={o.label} onClick={() => handle(o.id)} />
            ))}
          </div>
        )}
        {stepKey === "goal" && (
          <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
            {GOALS.map((g) => (
              <Tile key={g.id} active={answers.goal === g.id} justPicked={justPicked === g.id}
                color={T.pink} icon={g.icon} label={g.label} onClick={() => handle(g.id)} />
            ))}
          </div>
        )}
      </div>
    </div>
  );
}

/* ---------------------------------------------------------
   SCREEN: REVEAL (loading beat)
--------------------------------------------------------- */
function Reveal({ onDone, interestLabel }) {
  const [pct, setPct] = useState(0);
  useEffect(() => {
    const start = Date.now();
    const dur = 1200;
    const tick = () => {
      const p = Math.min(100, Math.round(((Date.now() - start) / dur) * 100));
      setPct(p);
      if (p < 100) requestAnimationFrame(tick);
      else setTimeout(onDone, 200);
    };
    requestAnimationFrame(tick);
  }, []);

  return (
    <div style={{
      flex: 1, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center",
      background: T.bg, gap: 22,
    }}>
      <div style={{ position: "relative", width: 100, height: 100 }}>
        <svg width="100" height="100" style={{ transform: "rotate(-90deg)" }}>
          <circle cx="50" cy="50" r="44" fill="none" stroke={T.border} strokeWidth="7" />
          <circle cx="50" cy="50" r="44" fill="none" stroke={T.pink} strokeWidth="7" strokeLinecap="round"
            strokeDasharray={2 * Math.PI * 44} strokeDashoffset={2 * Math.PI * 44 * (1 - pct / 100)}
            style={{ transition: "stroke-dashoffset 0.1s linear" }} />
        </svg>
        <div style={{
          position: "absolute", inset: 0, display: "flex", alignItems: "center", justifyContent: "center",
          fontFamily: DISPLAY_FONT, fontSize: 20, fontWeight: 800, color: T.plum,
        }}>{pct}%</div>
      </div>
      <div style={{ fontFamily: DISPLAY_FONT, fontWeight: 600, fontSize: 15, color: T.plum, textAlign: "center", padding: "0 40px" }}>
        {interestLabel ? `Calculating your ${interestLabel.toLowerCase()} matches...` : "Calculating your matches..."}
      </div>
    </div>
  );
}

        display: "flex", flexDirection: "column", zIndex: isTop ? 3 : 1,
        boxShadow: isTop ? "0 16px 40px rgba(25,6,28,0.18)" : "0 6px 16px rgba(25,6,28,0.08)",
      }}
    >
      {isTop && offset.x > 40 && (
        <div style={{
          position: "absolute", top: 26, left: 20, zIndex: 5, border: `3px solid ${T.pink}`, color: T.pink,
          padding: "6px 14px", borderRadius: 10, fontFamily: DISPLAY_FONT, fontWeight: 800,
          fontSize: 20, transform: "rotate(-14deg)", opacity: Math.min(1, offset.x / 100), background: "#fff",
        }}>LIKE</div>
      )}
      {isTop && offset.x < -40 && (
        <div style={{
          position: "absolute", top: 26, right: 20, zIndex: 5, border: `3px solid ${T.grey}`, color: T.grey,
          padding: "6px 14px", borderRadius: 10, fontFamily: DISPLAY_FONT, fontWeight: 800,
          fontSize: 20, transform: "rotate(14deg)", opacity: Math.min(1, -offset.x / 100), background: "#fff",
        }}>SKIP</div>
      )}

      <div style={{
        height: expanded ? "40%" : "56%", background: cat.color,
        display: "flex", alignItems: "center", justifyContent: "center", position: "relative", flexShrink: 0,
        transition: "height 0.25s ease",
      }}>
        <div style={{
          width: 84, height: 84, borderRadius: "50%", background: "rgba(255,255,255,0.22)",
          display: "flex", alignItems: "center", justifyContent: "center",
        }}>
          <Icon size={38} color="#fff" />
        </div>

        {!isRegisterInterest && (
          <div style={{
            position: "absolute", bottom: 14, right: 14, background: "#fff", color: T.plum,
            fontFamily: DISPLAY_FONT, fontWeight: 800, fontSize: 13, padding: "6px 12px",
            borderRadius: 999, display: "flex", alignItems: "center", gap: 4,
          }}>
            <Star size={12} fill={T.gold} color={T.gold} /> {matchPct}% MATCH
          </div>
        )}
        <div style={{
          position: "absolute", top: 14, left: 14, background: "rgba(25,6,28,0.35)", color: "#fff",
          fontSize: 11, fontWeight: 700, padding: "5px 10px", borderRadius: 999, letterSpacing: 0.5,
        }}>{course.level}</div>
      </div>

      <div style={{ padding: "18px 20px", flex: 1, display: "flex", flexDirection: "column", overflowY: "auto" }}>
        <h3 style={{ fontFamily: DISPLAY_FONT, fontSize: 16.5, color: T.plum, margin: 0, lineHeight: 1.3, fontWeight: 700 }}>
          {isRegisterInterest ? "We're always adding new courses" : course.title}
        </h3>
        <p style={{ color: T.textDim, fontSize: 13, marginTop: 8, lineHeight: 1.5 }}>
          {isRegisterInterest
            ? "We don't have a match for this yet, but register your interest and we'll let you know the moment something opens up."
            : course.blurb}
          {!isRegisterInterest && goalClause && <> {goalClause}</>}
        </p>

        {!isRegisterInterest && reasoning && (
          <div style={{
            marginTop: 4, display: "inline-flex", alignItems: "flex-start", gap: 6, fontSize: 11.5,
            color: T.plum, background: T.surface, padding: "7px 10px", borderRadius: 10, lineHeight: 1.4,
          }}>
            <Sparkles size={12} color={T.pink} style={{ flexShrink: 0, marginTop: 2 }} />
            <span><strong>Matched you</strong> because {reasoning}</span>
          </div>
        )}

        {expanded && !isRegisterInterest && (
          <div style={{ marginTop: 14, display: "flex", flexDirection: "column", gap: 8 }}>
            <DetailRow label="Duration" value={course.duration} />
            <DetailRow label="Funding" value={course.funding} />
          </div>
        )}

        <div style={{ marginTop: "auto", display: "flex", justifyContent: "center", paddingTop: 10 }}>
          {!isRegisterInterest && (
            <button onClick={onExpandToggle} style={{
              background: "none", border: "none", color: T.textDim, fontSize: 12, fontWeight: 700,
              display: "flex", alignItems: "center", gap: 4, cursor: "pointer",
            }}>
              {expanded ? "Show less" : "Tap for details"}
              <ChevronDown size={14} style={{ transform: expanded ? "rotate(180deg)" : "none", transition: "transform 0.2s" }} />
            </button>
          )}
        </div>
      </div>

  );
}

function DetailRow({ label, value }) {
  return (
    <div style={{ display: "flex", justifyContent: "space-between", fontSize: 12.5, borderBottom: `1px solid ${T.border}`, paddingBottom: 6 }}>
      <span style={{ color: T.textDim }}>{label}</span>
      <span style={{ color: T.plum, fontWeight: 700 }}>{value}</span>
    </div>
  );
}

function buildReasoning(answers) {
  const parts = [];
  const interest = INTERESTS.find((i) => i.id === answers.interest);
  if (interest) parts.push(`you're into ${interest.label.toLowerCase()}`);
  if (answers.age) parts.push(`you're ${answers.age}`);
  const goal = GOALS.find((g) => g.id === answers.goal);
  if (goal && goal.id !== "unsure") parts.push(`you want to ${goal.label.toLowerCase().replace("start a career in the industry", "start a career").replace("become self-employed", "go self-employed").replace("improve my existing skills", "build on your skills").replace("change careers", "change careers")}`);
  if (parts.length === 0) return null;
  if (parts.length === 1) return parts[0];
  return parts.slice(0, -1).join(", ") + " and " + parts[parts.length - 1];
}

function SwipeDeck({ matches, answers, onFinish }) {
  const cards = matches.ids.map((id) => COURSES[id]);
  const matchPcts = [96, 84, 71];
  const reasoning = useMemo(() => buildReasoning(answers), [answers]);
  const goalClause = GOAL_CLAUSE[answers.goal] || null;
  const [index, setIndex] = useState(0);
  const [offset, setOffset] = useState({ x: 0, y: 0, animating: false });
  const [expanded, setExpanded] = useState(false);
  const [liked, setLiked] = useState([]);
  const [bursts, setBursts] = useState([]);
  const [glows, setGlows] = useState([]);
  const dragRef = useRef({ startX: 0, startY: 0, dragging: false, moved: 0 });

  const isRegisterInterest = matches.type === "registerInterest";
  const done = index >= cards.length;

  const fireHeartBurst = () => {
    const glowId = `${Date.now()}-glow`;
    setGlows((prev) => [...prev, { id: glowId }]);
    setTimeout(() => setGlows((prev) => prev.filter((g) => g.id !== glowId)), 950);

    const newBursts = Array.from({ length: 7 }).map((_, i) => ({
      id: `${Date.now()}-${i}`,
      x: 30 + Math.random() * 40,
      delay: i * 55,
      size: 26 + Math.random() * 20,
      rotate: -20 + Math.random() * 40,
    }));
    setBursts((prev) => [...prev, ...newBursts]);
    setTimeout(() => {
      setBursts((prev) => prev.filter((b) => !newBursts.find((nb) => nb.id === b.id)));
    }, 1200);
  };

  const commitSwipe = (dir) => {
    const flyX = dir === "right" ? 600 : -600;
    setOffset({ x: flyX, y: offset.y - 40, animating: true });
    if (dir === "right") {
      setLiked((prev) => [...prev, cards[index]]);
      fireHeartBurst();
    }
    setTimeout(() => {
      setOffset({ x: 0, y: 0, animating: false });
      setExpanded(false);
      setIndex((i) => i + 1);
    }, 320);
  };

  const dragHandlers = {
    onPointerDown: (e) => {
      dragRef.current = { startX: e.clientX, startY: e.clientY, dragging: true, moved: 0 };
    },
    onPointerMove: (e) => {
      if (!dragRef.current.dragging) return;
      const dx = e.clientX - dragRef.current.startX;
      const dy = e.clientY - dragRef.current.startY;
      dragRef.current.moved = Math.abs(dx) + Math.abs(dy);
      setOffset({ x: dx, y: dy, animating: false });
    },
    onPointerUp: () => {
      if (!dragRef.current.dragging) return;
      dragRef.current.dragging = false;
      const dx = offset.x;
      if (dragRef.current.moved < 6) {
        setExpanded((v) => !v);
        setOffset({ x: 0, y: 0, animating: true });
        return;
      }
      if (dx > 110) commitSwipe("right");
      else if (dx < -110) commitSwipe("left");
      else setOffset({ x: 0, y: 0, animating: true });
    },
  };

  const rotation = Math.max(-18, Math.min(18, offset.x / 12));

  return (
    <div style={{ flex: 1, display: "flex", flexDirection: "column", padding: "16px 18px 18px", background: T.bg }}>
      <div style={{ textAlign: "center", marginBottom: 12 }}>
        <div style={{ fontFamily: DISPLAY_FONT, fontSize: 17, color: T.plum, fontWeight: 700 }}>
          {isRegisterInterest ? "Here's what we found" : "Your matches are in"}
        </div>
        <div style={{ fontSize: 12, color: T.textDim, marginTop: 3 }}>
          {isRegisterInterest ? "Swipe or tap to continue" : "Swipe right to save, left to skip"}
        </div>
      </div>

      <div style={{ position: "relative", flex: 1 }}>
        <HeartBurst bursts={bursts} glows={glows} />
        {done ? (
          <FinishedPanel liked={liked} isRegisterInterest={isRegisterInterest} onFinish={() => onFinish(liked)} />
        ) : (
          cards.map((course, i) => {
            if (i < index || i > index + 1) return null;
            const isTop = i === index;
            return (
              <SwipeCard
                key={i}
                course={course}
                matchPct={matchPcts[i]}
                isTop={isTop}
                offset={isTop ? offset : { x: 0, y: 8, animating: false }}
                rotation={isTop ? rotation : 0}
                isRegisterInterest={isRegisterInterest}
                expanded={isTop && expanded}
                onExpandToggle={() => setExpanded((v) => !v)}
                dragHandlers={dragHandlers}
                reasoning={reasoning}
                goalClause={goalClause}
              />
            );
          })
        )}
      </div>

      {!done && (
        <div style={{ display: "flex", justifyContent: "center", gap: 20, marginTop: 16 }}>
          <button onClick={() => commitSwipe("left")} aria-label="Skip" style={{
            width: 54, height: 54, borderRadius: "50%", border: `1.5px solid ${T.border}`, background: T.bg,
            display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer", color: T.grey,
          }}><X size={24} /></button>
          <button onClick={() => commitSwipe("right")} aria-label="Save" style={{
            width: 54, height: 54, borderRadius: "50%", border: "none", background: T.pink,
            display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer", color: "#fff",
          }}><Heart size={24} fill="#fff" /></button>
        </div>
      )}
    </div>
  );
}

function FinishedPanel({ liked, isRegisterInterest, onFinish }) {
  const empty = liked.length === 0 && !isRegisterInterest;
  return (
    <div style={{
      position: "absolute", inset: 0, borderRadius: 24, background: T.surface,
      border: `1px solid ${T.border}`, display: "flex", flexDirection: "column",
      alignItems: "center", justifyContent: "center", padding: 30, textAlign: "center", gap: 14,
    }}>
      <div style={{
        width: 58, height: 58, borderRadius: "50%", background: "#fff",
        display: "flex", alignItems: "center", justifyContent: "center", border: `1.5px solid ${T.border}`,
      }}>
        <Heart size={24} color={T.pink} fill={empty ? "none" : T.pink} />
      </div>
      <div style={{ fontFamily: DISPLAY_FONT, fontSize: 16, color: T.plum, fontWeight: 700 }}>
        {empty ? "Nothing saved yet" : "Nice picks!"}
      </div>
      <p style={{ color: T.textDim, fontSize: 13, lineHeight: 1.5 }}>
        {empty
          ? "That's okay, we'll send you your original best match so you don't miss it."
          : `You saved ${liked.length} course${liked.length > 1 ? "s" : ""}. Let's get your personalised recommendations sent over.`}
      </p>
      <button onClick={onFinish} style={{
        width: "100%", padding: "14px 20px", borderRadius: 14, border: "none", cursor: "pointer",
        background: T.pink, color: "#fff",
        fontFamily: DISPLAY_FONT, fontSize: 14, fontWeight: 700, marginTop: 6,
      }}>
        Continue <ArrowRight size={15} style={{ display: "inline", verticalAlign: -2, marginLeft: 4 }} />
      </button>
    </div>
  );
}

/* ---------------------------------------------------------
   ROOT APP
--------------------------------------------------------- */
function LCBTCourseFinder() {
  useFonts();
  const [screen, setScreen] = useState("landing");
  const [answers, setAnswers] = useState({});
  const [stepIndex, setStepIndex] = useState(0);
  const [liked, setLiked] = useState([]);

  const steps = useMemo(() => getSteps(answers), [answers]);
  const matches = useMemo(() => (screen === "results" ? getMatches(answers) : null), [screen, answers]);

  const restart = () => {
    setAnswers({});
    setStepIndex(0);
    setLiked([]);
    setScreen("landing");
  };

  const goNextStep = () => {
    const nextSteps = getSteps(answers);
    if (stepIndex + 1 < nextSteps.length) {
      setStepIndex(stepIndex + 1);
    } else {
      setScreen("reveal");
    }
  };

  const goBackStep = () => {
    if (stepIndex === 0) { setScreen("vibe"); return; }
    setStepIndex(stepIndex - 1);
  };

  return (
    <PhoneFrame>
      <style>{`
        @keyframes chipIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes heartRise {
          0% { opacity: 0; transform: translateY(0) scale(0.6) rotate(var(--r, 0deg)); }
          15% { opacity: 1; transform: translateY(-20px) scale(1) rotate(var(--r, 0deg)); }
          100% { opacity: 0; transform: translateY(-260px) scale(0.9) rotate(var(--r, 0deg)); }
        }
        @keyframes glowRise {
          0% { opacity: 0; transform: translateY(0) scale(0.7); }
          30% { opacity: 1; transform: translateY(-40px) scale(1); }
          100% { opacity: 0; transform: translateY(-160px) scale(1.15); }
        }
      `}</style>

      {screen === "landing" && <Landing onStart={() => setScreen("vibe")} />}

      {screen === "vibe" && (
        <>
          <TopBar onBack={() => setScreen("landing")} />
          <VibeSwipeDeck onComplete={(interestId) => {
            setAnswers((prev) => ({ ...prev, interest: interestId }));
            setScreen("quiz");
          }} />
        </>
      )}

      {screen === "quiz" && (
        <>
          <TopBar onBack={goBackStep} />
          <ProgressBar total={steps.length} current={stepIndex} />
          <ProfileStrip answers={answers} steps={["interest", ...steps]} />
          <Quiz
            answers={answers} setAnswers={setAnswers} stepKey={steps[stepIndex]}
            onNext={goNextStep} stepIndex={stepIndex} totalSteps={steps.length}
          />
        </>
      )}

      {screen === "reveal" && (
        <Reveal onDone={() => setScreen("results")} interestLabel={INTERESTS.find((i) => i.id === answers.interest)?.label} />
      )}

      {screen === "results" && (
        <>
          <TopBar />
          <SwipeDeck matches={matches} answers={answers} onFinish={(l) => { setLiked(l); setScreen("email"); }} />
        </>
      )}

      {screen === "email" && (
        <>
          <TopBar onBack={() => setScreen("results")} />
          <EmailCapture liked={liked} onSubmit={() => setScreen("confirmation")} />
        </>
      )}

      {screen === "confirmation" && <Confirmation liked={liked} onRestart={restart} />}
    </PhoneFrame>
  );
}


const root = createRoot(document.getElementById("root"));
root.render(<LCBTCourseFinder />);
</script>
